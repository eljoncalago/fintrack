<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinTrack — Multi-Country Finance</title>
    <meta name="description" content="Futuristic multi-country personal finance accounting system." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/css/styles.css" />
  </head>
  <body>
    <!-- Loading screen -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-card">
        <div class="loading-logo">
          <span class="loading-logo-mark">◈</span>
          <span class="loading-logo-text">FinTrack</span>
        </div>
        <div class="loading-bar"><div class="loading-bar-fill" id="loading-bar-fill"></div></div>
        <p class="loading-status" id="loading-status">Connecting to server…</p>
      </div>
    </div>

    <!-- App shell -->
    <div id="app" class="app hidden">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <span class="sidebar-mark">◈</span>
          <span class="sidebar-name">FinTrack</span>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer">
          <span class="sidebar-footer-dot" id="sync-dot"></span>
          <span id="sync-label">Synced</span>
        </div>
      </aside>

      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <main class="main">
        <header class="topbar">
          <button class="icon-btn hamburger" id="hamburger" aria-label="Menu">
            <span></span><span></span><span></span>
          </button>
          <h1 class="topbar-title" id="topbar-title">Dashboard</h1>
          <div class="topbar-actions">
            <button class="btn btn-ghost" id="refresh-btn" title="Refresh data">
              <span class="btn-icon">↻</span><span class="btn-label">Refresh</span>
            </button>
          </div>
        </header>

        <section class="content" id="content"></section>
      </main>
    </div>

    <!-- Modal root -->
    <div class="modal-root" id="modal-root"></div>
    <!-- Toast root -->
    <div class="toast-root" id="toast-root"></div>

    <script type="module" src="src/js/app.js"></script>
  </body>
</html>
